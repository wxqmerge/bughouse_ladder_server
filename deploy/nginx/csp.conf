# CSP + security headers for the nginx-served frontend (/<instance>/dist/).
# The express app's helmet CSP never reaches these responses, so nginx must add it.
#
# Paste inside the PARENT-domain server block (same place as the
# access_log off snippet from dist-nolog.conf). Replace example.com with
# the real parent domain. Note: a `location` that defines its own
# add_header directives does NOT inherit these — repeat them there.
#
# After editing: sudo nginx -t && sudo systemctl reload nginx

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.example.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
