# CSP + security headers for the nginx-served frontend (/<instance>/dist/).
# The express app's helmet CSP never reaches these responses, so nginx must add it.
#
# Paste inside the PARENT-domain server block (same place as the
# access_log off snippet from dist-nolog.conf). Replace example.com with
# the real parent domain. Note: a `location` that defines its own
# add_header directives does NOT inherit these — repeat them there.
#
# IMPORTANT: the frontend is built with vite-plugin-singlefile — one HTML file
# with INLINE <script>/<style>. `script-src 'self'` would block the app itself,
# so 'unsafe-inline' is required here. CSP cannot mitigate XSS inside a fully
# inlined bundle; the durable value of this header is frame-ancestors,
# object-src, and base-uri. True script protection would need a nonced build
# (no singlefile), which is a separate change.
#
# After editing: sudo nginx -t && sudo systemctl reload nginx
# After applying, confirm the app still loads (blank page = a CSP directive too strict).

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.example.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
