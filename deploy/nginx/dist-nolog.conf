# Nginx secret-leak fix for config shortcut URLs (?key=<secret>)
#
# Bookmark/config URLs send the API key in the query string:
#   GET /<instance>/dist/?config=1&server=...&key=<secret>
# The default nginx log_format records $request (path + query), so every load
# writes the live key into /var/log/nginx/access.log.
#
# This belongs in the PARENT-domain vhost (e.g. /etc/nginx/sites-available/your-domain.com.conf)
# that serves the /<instance>/dist/ static paths — not in the instance subdomain configs.
#
# Preferred: add the single line `access_log off;` to the existing location block
# that serves /<instance>/dist/. If no such block exists, paste the location below.

location ~ ^/[a-z0-9-]+/dist/ {
    access_log off;
    # Keep whatever static serving the parent vhost already does here,
    # e.g.: root /var/www/html;  (paths resolve as /<instance>/dist/...)
}

# After editing: sudo nginx -t && sudo systemctl reload nginx
# Then purge already-logged keys: sudo truncate -s 0 /var/log/nginx/access.log
# and delete rotated logs:  sudo rm /var/log/nginx/access.log.*
