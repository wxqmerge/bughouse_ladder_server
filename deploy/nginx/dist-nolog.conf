# Nginx secret-leak fix for config shortcut URLs (?key=<secret>)
#
# Bookmark/config URLs send the API key in the query string:
#   GET /<instance>/dist/?config=1&server=...&key=<secret>
# The default nginx log_format records $request (path + query), so every load
# writes the live key into /var/log/nginx/access.log.
#
# This goes in the PARENT-domain vhost (e.g. /etc/nginx/sites-available/your-domain.conf)
# that serves the /<instance>/dist/ static paths — BEFORE any `location /`.
# For SUBDOMAIN vhosts (<app>.<parent>), use the map + `if` line at the bottom.
#
# Verified on nginx 1.22:
# - `try_files` does NOT expand captures: `try_files /$1/... =404` 404s as a
#   literal path. Use `rewrite ^ /$app/... break;` to serve from the no-log location.
# - Do NOT rely on the `index` directive here: the internal redirect it triggers
#   re-logs the request through the final location.

location ~ ^/(?<app>[a-z0-9-]+)/dist/$ {
    access_log off;
    rewrite ^ /$app/dist/index.html break;
}
location ~ ^/[a-z0-9-]+/dist/ {
    access_log off;   # assets/subpaths keep the parent vhost's inherited root
}

# Subdomain vhosts: create /etc/nginx/conf.d/nolog-key.conf ONCE with
#   map $arg_key $log_without_key { default 1; "~.+" 0; }
# then in each app vhost add:
#   access_log /var/log/nginx/access.log combined if=$log_without_key;
# (only key-bearing requests skip the log; header-auth API traffic is fully logged)

# After editing: sudo nginx -t && sudo systemctl reload nginx
# Test with a marker key (from the server use --resolve <host>:443:127.0.0.1):
#   M=T1$$; curl -sk --resolve <host>:443:127.0.0.1 "https://<host>/<instance>/dist/?key=$M"
#   sleep 1; sudo grep -c "$M" /var/log/nginx/access.log || echo NOT LOGGED
# Then purge already-logged keys: sudo truncate -s 0 /var/log/nginx/access.log
# and delete rotated logs:  sudo rm -f /var/log/nginx/access.log.*
# Purge != safe: rotate the keys afterwards.
